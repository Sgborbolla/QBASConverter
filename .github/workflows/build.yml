name: Build and Release QBASCONVERTER

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller

      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --name QBASCONVERTER qbasconverter.py

      - name: Prepare package
        shell: bash
        run: |
          mkdir -p package/${{ matrix.name }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/QBASCONVERTER.exe package/${{ matrix.name }}/
          else
            cp dist/QBASCONVERTER package/${{ matrix.name }}/
            chmod +x package/${{ matrix.name }}/QBASCONVERTER
          fi
          echo "QBASCONVERTER v3.1.8-pro - ${{ matrix.name }} (TUI)" > package/${{ matrix.name }}/LEER.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QBASCONVERTER-${{ matrix.name }}
          path: package/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack
        run: |
          mkdir -p release
          for d in artifacts/*; do
            n=$(basename $d | sed 's/QBASCONVERTER-//')
            mkdir -p release/$n
            cp -r $d/* release/$n/
          done
          cd release
          zip -r ../QBASCONVERTER-v3.1.8-pro.zip Windows Linux macOS
          cd ..

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QBASCONVERTER v3.1.8-pro
          files: QBASCONVERTER-v3.1.8-pro.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
